	<script>
		function RandomAngkaAtoB(a,b){ 
			var r = a+Math.ceil(Math.random() * b);
			return r;
		}
		function RandomMyArray(Arr){
			for (var i=0; i<Arr.length; i++){
				var r = Math.floor(Math.random() * Arr.length);
				var a = Arr[i];
				Arr[i] = Arr[r];
				Arr[r] = a;
			}
			return Arr
		}
		function StringDesimal(ff){
			var strff = ""+ff;
			const gg = strff.split(".");
			if(gg.length==2)	return gg[0]+","+gg[1];
			else 				return ff
		}
		function StringRibuan(str){
			var strfix = "";
			var arfix = new Array();
			var StrArray = SplitString(str);
			for (var i=0; i<StrArray.length; i++){
				arfix.push(StrArray[i]);
			}
			var ct = 0;
			var m = 0;
			var n = 0;
			var ctmax = StrArray.length;
			var arct = new Array();
			for (var i=StrArray.length-1; i>=0; i--){
				ct++;
				ctmax--;
				if(ct==3){
					ct = 0;
					m++;
					arct.push(3);
				}
			}
			var n = StrArray.length - 3*arct.length;
			var iter=-1;
			strfix="";
			for (var i=0; i<n; i++){
				iter++;
				strfix += arfix[iter];
			}
			if (n>0)
				strfix += ".";
			for (var i=0; i<m; i++){
				for (j=0; j<3; j++){
					iter++;
					strfix += arfix[iter];
				}
				strfix += ".";
			}
			var leng = strfix.length;
			strfix = strfix.substr(0, leng-1);
			return strfix
		}
		function SplitString(ff){
			var gg = new Array();
			var strff = ""+ff;
			var len = strff.length;
			for (var i=0; i<len; i++){
				gg.push(strff.substr(i,1));
			}
			return gg;
		}
		function CariFPB(ar){
			//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
			
			var min = 0;
			var max = 0;
			for(var i=0;i<ar.length;i++){
				min = Math.min(min,ar[i]);
				max = Math.max(max,ar[i]);
			}
			
			var iter = 0;
			var fpb = 1;
			var f = [];
			do {
				iter++;
				ff = 1;
				for(var i=0;i<ar.length;i++){
					f[i] = (ar[i]%iter)==0;
					ff *= f[i];
				}
				
				if (ff){
					fpb = iter;
				}
				fakhir = iter==max;
			}while (!fakhir);
			
			return fpb;
		}
		function sortAZ(arr){
			arr.sort(function(a, b){return a-b});
			return arr;
		}
		function sortZA(arr){
			arr.sort(function(a, b){return b-a});
			return arr;
		}
	</script>

		var fixscale = 1;
		var fixzoom
		document.body.style.backgroundColor = "black";
		window.addEventListener('resize', () => {
			ZoomAll();
		});
		function XYbenda(){
			lebarJendela = window.innerWidth;
			tinggiJendela = window.innerHeight;
			myBG.x = window.scrollX+(lebarJendela-840*scl)/2;
			myBG.y = window.scrollY+(tinggiJendela-472*scl)/2;
			myBG.style.left = ''+(myBG.x)+'px';
			myBG.style.top = ''+(myBG.y)+'px';
		}
		function ZoomAll(){
			let lebarJendela = window.innerWidth;
			let tinggiJendela = window.innerHeight;
			var xscale = lebarJendela/840;
			var yscale = tinggiJendela/472;
			scl = 0.95*Math.min(xscale,yscale);
			fixscale = scl;
			fixzoom = scl*100;
			document.body.style.zoom = ""+fixzoom+"%";
			XYbenda();
		}
		
		ZoomAll();
		function handleClick(event) {
			console.log("handleClick");
		}
		myBG.addEventListener('click', handleClick);
		setTimeout(() => {
			console.log("handleClick")
			ZoomAll();
			myBG.removeEventListener('click', handleClick);
		}, 100);
		
	</script>
