		function RandomAngkaAtoB(a,b){ 
			var r = a+Math.ceil(Math.random() * b);

		function RandomMyArray(Arr){
			for (var i=0; i<Arr.length; i++){
				var r = Math.floor(Math.random() * Arr.length);
				var a = Arr[i];
				Arr[i] = Arr[r];
				Arr[r] = a;
			}
			return Arr
		}
		function StringDesimal(ff){
			var strff = ""+ff;
			const gg = strff.split(".");
			if(gg.length==2)	return gg[0]+","+gg[1];
			else 				return ff
		}
		function CariFPB(ar){
			//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
			
			var min = 0;
			var max = 0;
			for(var i=0;i<ar.length;i++){
				min = Math.min(min,ar[i]);
				max = Math.max(max,ar[i]);
			}
			
			var iter = 0;
			var fpb = 1;
			var f = [];
			do {
				iter++;
				ff = 1;
				for(var i=0;i<ar.length;i++){
					f[i] = (ar[i]%iter)==0;
					ff *= f[i];
				}
				
				if (ff){
					fpb = iter;
				}
				fakhir = iter==max;
			}while (!fakhir);
			
			return fpb;
		}
	</script>

	<script>
		
		function DrawLingkaran(canv,xo,yo,rr){
			const canvas = document.getElementById(canv);
			const ctx = canvas.getContext('2d');
			var rr = 100;
			
			ctx.clearRect(0,0, canvas.width, canvas.height);
			ctx.fillStyle = '#ffffff'; // Warna 
			ctx.beginPath();
			ctx.strokeStyle = '#000000'; // Warna 
			ctx.lineWidth = 3; // Ketebalan garis 5px
			ctx.lineJoin = "round";
			
			ctx.arc(xo, yo, rr, 0, 2 * Math.PI);
			ctx.fill();
			ctx.closePath();
			ctx.stroke();
			return 0;
		}
		function DrawArc(canv,xo,yo,nn,nwarna){
			const canvas = document.getElementById(canv);
			const ctx = canvas.getContext('2d');
			var rr = 100;
			
			ctx.clearRect(0,0, canvas.width, canvas.height);
			ctx.strokeStyle = '#000000'; // Warna 
			ctx.lineWidth = 1; // Ketebalan garis 5px
			ctx.lineJoin = "round";
			
			if(nn>1){
				for(var i=1;i<=nn;i++){
					ctx.beginPath();
					var a = (i-1)*(1/nn);
					var b = (i)*(1/nn);
					ctx.moveTo(xo, yo);
					ctx.arc(xo, yo, rr, 2*Math.PI*a, 2*Math.PI*b);
					ctx.closePath();
					if(i<=nwarna)	ctx.fillStyle = '#ffff00'; // Warna 
					else			ctx.fillStyle = '#ffffff'; // Warna 
					ctx.fill();
					ctx.stroke();
				}
			}else{
				var a = 0;
				var b = 1
				ctx.beginPath();
				ctx.arc(xo, yo, rr, 2*Math.PI*a, 2*Math.PI*b);
				ctx.closePath();
				if(nn==nwarna)	ctx.fillStyle = '#ffff00'; // Warna 
				else			ctx.fillStyle = '#ffffff'; // Warna 
				ctx.fill();
				ctx.stroke();
			}
			return 0;
		}
		
		//DrawArc('lingkaran',x0,y0,12,0);
		DrawLingkaran('lingkaran',x0,y0);
	</script>

            el.addEventListener('touchstart', dragMouseDown, { signal: controller.signal } ,{ passive: false });
			
			el.ff = false;
            function dragMouseDown(e) {
                e.preventDefault();
				if(!selectedEl){
					selectElement(el);
					if(e.type==="touchstart"){
						startX = e.touches[0].clientX;
						startY = e.touches[0].clientY;
						initialX = el.offsetLeft;
						initialY = el.offsetTop;
						document.addEventListener('touchend', dragMouseUp);
						document.addEventListener('touchmove', dragMouseMove, { passive: false });
					}else{
						startX = e.clientX;
						startY = e.clientY;
						initialX = el.offsetLeft;
						initialY = el.offsetTop;
						document.addEventListener('mouseup', dragMouseUp);
						document.addEventListener('mousemove', dragMouseMove);
					}
					movein=false;
					nfix1=nfix0
				}
            }
			var arChild = [];
			var nfix0 = 0;
			var nfix1 = 0;
			var movein = false;
			AddRemove(1);
			function cekTekan(sX,sY){
				const rect = myBG.getBoundingClientRect();
				const xF = (sX/ scl - rect.left) ;
				const yF = (sY/ scl - rect.top) ;
				//titik.style.left = (xF)+'px';
				//titik.style.top = (yF)+'px';
				
				var rklik = Math.sqrt((xF-x0)**2+(yF-y0)**2);
				var ff = rklik<=100;
				
				if(ff){		
					var sdt = Math.ceil(Math.atan2(yF-y0,xF-x0)*180/Math.PI);
					if(sdt<0) sdt+=360;
					var ct = Math.ceil(sdt / (360/nfix1));
					DrawArc('lingkaran',x0,y0,nfix1,ct);
					pembilang0.innerHTML = ct;
					penyebut0.innerHTML = nfix1;
					
					var fpb = CariFPB([ct,nfix1])
					pembilang1.innerHTML = ct/fpb;
					penyebut1.innerHTML = nfix1/fpb;
				}
			}
			

            function dragMouseMove(e) {
				e.preventDefault();
				if(selectedEl){
					let deltaX=0;
					let deltaY=0;
					if(e.type==="touchmove"){
						deltaX = (e.touches[0].clientX - startX) / scl;
						deltaY = (e.touches[0].clientY - startY) / scl;
					}else{
						deltaX = (e.clientX - startX) / scl;
						deltaY = (e.clientY - startY) / scl;
					}
					AddRemove(Math.round(deltaX/10));
					movein = true;
				}
            }
			
			function AddRemove(nn){
				mc2.klik = false;
				mc2.style.opacity='0';
				var nmax = 40
				var nfix = Math.min(Math.max(1,nfix1+nn),nmax);
				DrawArc('lingkaran',x0,y0,nfix,0);
				nfix0 = nfix;
				pembilang0.innerHTML = 0;
				penyebut0.innerHTML = nfix0;
				
				pembilang1.innerHTML = 0;
				penyebut1.innerHTML = nfix0;
			}
			
            function dragMouseUp() {
				if(selectedEl){
					if(!movein){
						cekTekan(startX,startY);
					}
					isdrag = false;
					UnselectElement(el);
				}
			}
        }
	</script>
