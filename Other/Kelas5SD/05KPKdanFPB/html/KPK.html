	<script>
		function RandomAngkaAtoB(a,b){ 
			var r = a+Math.ceil(Math.random() * b);
			return r;
		}
		function RandomMyArray(Arr){
			for (var i=0; i<Arr.length; i++){
				var r = Math.floor(Math.random() * Arr.length);
				var a = Arr[i];
				Arr[i] = Arr[r];
				Arr[r] = a;
			}
			return Arr
		}
		function StringDesimal(ff){
			var strff = ""+ff;
			const gg = strff.split(".");
			if(gg.length==2)	return gg[0]+","+gg[1];
			else 				return ff
		}
		function StringRibuan(str){
			var strfix = "";
			var arfix = new Array();
			var StrArray = SplitString(str);
			for (var i=0; i<StrArray.length; i++){
				arfix.push(StrArray[i]);
			}
			var ct = 0;
			var m = 0;
			var n = 0;
			var ctmax = StrArray.length;
			var arct = new Array();
			for (var i=StrArray.length-1; i>=0; i--){
				ct++;
				ctmax--;
				if(ct==3){
					ct = 0;
					m++;
					arct.push(3);
				}
			}
			var n = StrArray.length - 3*arct.length;
			var iter=-1;
			strfix="";
			for (var i=0; i<n; i++){
				iter++;
				strfix += arfix[iter];
			}
			if (n>0)
				strfix += ".";
			for (var i=0; i<m; i++){
				for (j=0; j<3; j++){
					iter++;
					strfix += arfix[iter];
				}
				strfix += ".";
			}
			var leng = strfix.length;
			strfix = strfix.substr(0, leng-1);
			return strfix
		}
		function SplitString(ff){
			var gg = new Array();
			var strff = ""+ff;
			var len = strff.length;
			for (var i=0; i<len; i++){
				gg.push(strff.substr(i,1));
			}
			return gg;
		}
		function CariFPB(ar){
			//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
			
			var min = 0;
			var max = 0;
			for(var i=0;i<ar.length;i++){
				min = Math.min(min,ar[i]);
				max = Math.max(max,ar[i]);
			}
			
			var iter = 0;
			var fpb = 1;
			var f = [];
			do {
				iter++;
				ff = 1;
				for(var i=0;i<ar.length;i++){
					f[i] = (ar[i]%iter)==0;
					ff *= f[i];
				}
				
				if (ff){
					fpb = iter;
				}
				fakhir = iter==max;
			}while (!fakhir);
			
			return fpb;
		}
		function sortAZ(arr){
			arr.sort(function(a, b){return a-b});
			return arr;
		}
		function sortZA(arr){
			arr.sort(function(a, b){return b-a});
			return arr;
		}
	</script>

	<script>
		function Akar(){
			var prime = [2,3,5,7];
			var arr0 = [];
			var aa = 1;
			for(var i=1;i<=5;i++){
				prime=RandomMyArray(prime);
				arr0[i-1]=prime[0];
				aa*=arr0[i-1];
			}
			arr0=sortAZ(arr0);
			
			var arr1=[];
			arr1[0] = aa; 				
			arr1[1] = arr0[0]; 			
			arr1[2] = arr1[0]/arr1[1];
			arr1[3] = arr0[1];
			arr1[4] = arr1[2]/arr1[3];
			arr1[5] = arr0[2];
			arr1[6] = arr1[4]/arr1[5];
			arr1[7] = arr0[3];
			arr1[8] = arr1[6]/arr1[7];
			
			if(aa>999)				arr1[0]=StringRibuan(aa);
			if(aa/arr1[1]>999)	arr1[2]=StringRibuan(aa/arr1[1]);
			
			return arr1;
		}

			function GetSatuAngka(ar){
				let hasils = [];
				for (let i = 0; i < ar.length; i++) {
					let angka = ar[i];
					if (!hasils.includes(angka)) {
						hasils.push(angka);
					}
				}
				return hasils;
			}
			function GetPangkat(arAsli,arAngka){
				let hasils = [];
				for (let i = 0; i < arAngka.length; i++) {
					hasils[i] = 0;
					for (let j = 0; j < arAsli.length; j++) {
						if(arAngka[i]==arAsli[j]){
							hasils[i]++;
						}
					}
				}
				let fixAngkaPangkat = [];
				for (let i = 0; i < arAngka.length; i++) {
					fixAngkaPangkat.push([arAngka[i],hasils[i]])
				}
				return fixAngkaPangkat;
			}
			
			function inner(ar){
				var pangkat = ['\u{2070}','\u{00B9}','\u{00B2}','\u{00B3}','\u{2074}','\u{2075}','\u{2076}','\u{2077}','\u{2078}','\u{2079}'];

					afg.push([ar[i][0],ar[i][1]])
					if(ar[i][1]>1)		document.getElementById('hasil'+tt).innerHTML += pangkat[ar[i][1]];
					if(i<ar.length-1)	document.getElementById('hasil'+tt).innerHTML += ' \u{00D7} ';
				}
			}
			angkaP = GetSatuAngka(angkaP);
			let AngkaPangkat = GetPangkat(arfix,angkaP);

			DrawGaris('garisf',0,0);

		function carisama(ar){
			var del = [];
			var arEmpty = [].concat(ar);
			// mencari yang perlu didelete (pangkat terendah)
			for(let i=0;i<ar.length-1;i++){
				for(let j=i+1;j<ar.length;j++){
					if(ar[i][0]==ar[j][0]){
						if(ar[i][1]>ar[j][1])		del.push(j);
						else						del.push(i);
					}
				}	
			}
			del = sortAZ(del); // urutkan delete dari belakang;
			//mendelete array pangkat terendah
			var n = del.length-1;
			while(n>=0){
				arEmpty.splice(del[n], 1); 
				n--;
			}
			//urutkan dari terkecil
			for(let i=0;i<arEmpty.length-1;i++){
				for(let j=i+1;j<arEmpty.length;j++){
					if(arEmpty[i][0]>arEmpty[j][0]){
						var temp = arEmpty[j];
						arEmpty[j] = arEmpty[i];
						arEmpty[i] = temp;
					}
				}
			}
			//mencari hasil cari KPK
			var fixKPK = 1;
			for(let i=0;i<arEmpty.length;i++){
				for(let j=0;j<arEmpty[i][1];j++){
					fixKPK*=arEmpty[i][0];
				}
			}
			return [arEmpty,fixKPK];
		}

		function XYbenda(){
			lebarJendela = window.innerWidth;

			myBG.style.top = ''+(myBG.y)+'px';

			let lebarJendela = window.innerWidth;
			let tinggiJendela = window.innerHeight;
			var xscale = lebarJendela/840;
			var yscale = tinggiJendela/472;
			scl = 0.95*Math.min(xscale,yscale);
			fixscale = scl;
			fixzoom = scl*100;
			document.body.style.zoom = ""+fixzoom+"%";
			XYbenda();
		}
