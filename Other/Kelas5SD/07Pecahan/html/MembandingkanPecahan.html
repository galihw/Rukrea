	<script>
		function RandomAngkaAtoB(a,b){ 
			var r = a+Math.ceil(Math.random() * b);
			return r;
		}
		function RandomMyArray(Arr){
			for (var i=0; i<Arr.length; i++){
				var r = Math.floor(Math.random() * Arr.length);
				var a = Arr[i];
				Arr[i] = Arr[r];
				Arr[r] = a;
			}
			return Arr
		}
		function StringDesimal(ff){
			var strff = ""+ff;
			const gg = strff.split(".");
			if(gg.length==2)	return gg[0]+","+gg[1];
			else 				return ff
		}
		function CariFPB(ar){
			//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
			
			var min = 0;
			var max = 0;
			for(var i=0;i<ar.length;i++){
				min = Math.min(min,ar[i]);
				max = Math.max(max,ar[i]);
			}
			
			var iter = 0;
			var fpb = 1;
			var f = [];
			do {
				iter++;
				ff = 1;
				for(var i=0;i<ar.length;i++){
					f[i] = (ar[i]%iter)==0;
					ff *= f[i];
				}
				
				if (ff){
					fpb = iter;
				}
				fakhir = iter==max;
			}while (!fakhir);
			
			return fpb;
		}
		function CariKPK(ar){
			var min = 1000000;
			var max = 0;
			for(var i=0;i<ar.length;i++){
				min = Math.min(min,ar[i]);
				max = Math.max(max,ar[i]);
			}
			
			var iter = min;
			var kpk = 1;
			var f = [];
			do {
				iter++;
				ff = 1;
				for(var i=0;i<ar.length;i++){
					f[i] = (iter%ar[i])==0;
					ff *= f[i];
				}
				
				if (ff){
					kpk = iter;
				}
			}while (!ff);
			
			return kpk;
		}

	<script>
		var selectedEl = null;
		let startX=0, startY=0, initialX=0, initialY=0;
		const controller = new AbortController();
        function selectElement(el) {
            UnselectElement(el)
            selectedEl = el;
            //selectedEl.classList.add('terseleksi');
        }
        function UnselectElement(el) {
            if (selectedEl) {
                //selectedEl.classList.remove('terseleksi');
                //selectedEl.classList.remove('dropbenar');
				selectedEl = null;
            }
        }
		function setupDraggable(el,mc,container,pembilang,penyebut) {
			//var xmax = (mc.offsetWidth-el.offsetWidth);
			//var ymax = (mc.offsetHeight-el.offsetHeight);
			var xmax = (myBG.w-el.offsetWidth/2);
			var ymax = (myBG.h-el.offsetHeight/2);
			var xmin = el.offsetWidth/2;
			var ymin = el.offsetHeight/2;
			let newX=0, newY=0;
			el.pembilang = pembilang;
			el.penyebut = penyebut;
            el.addEventListener('mousedown', dragMouseDown,{ signal: controller.signal });
            el.addEventListener('touchstart', dragMouseDown, { signal: controller.signal } ,{ passive: false });
			
			el.ff = false;
            function dragMouseDown(e) {
                e.preventDefault();
				if(!selectedEl){
					selectElement(e.target);
					if(e.type==="touchstart"){
						startX = e.touches[0].clientX;
						startY = e.touches[0].clientY;
						initialX = selectedEl.offsetLeft;
						initialY = selectedEl.offsetTop;
						document.addEventListener('touchend', dragMouseUp);
						document.addEventListener('touchmove', dragMouseMove, { passive: false });
					}else{
						startX = e.clientX;
						startY = e.clientY;
						initialX = selectedEl.offsetLeft;
						initialY = selectedEl.offsetTop;
						document.addEventListener('mouseup', dragMouseUp);
						document.addEventListener('mousemove', dragMouseMove);
					}
					selectedEl.movein=false;
					selectedEl.nfix1=selectedEl.nfix0;
				}
            }
			el.arChild = [];
			el.nfix0 = 0;
			el.nfix1 = 0;
			el.movein = true;
			AddRemove(el,1);
			function cekTekan(sX,sY,elm){
				const rect = myBG.getBoundingClientRect();
				const xF = (sX / scl- rect.left) ;
				const yF = (sY / scl - rect.top);
				titik.style.left = (xF)+'px';
				titik.style.top = (yF)+'px';
				elm.classList.remove('arisi');
				var ww = 700;
				var hh = 80;
				var areax = (elm.x0-ww/2 <= xF) && (elm.x0+ww/2 >= xF);
				var areay = (elm.y0-hh/2 <= yF) && (elm.y0+hh/2 >= yF);
				if(areax && areay){
					elm.ct = Math.ceil((xF-(elm.x0-ww/2))/Math.ceil(ww/elm.nfix1));
					for(var j=1;j<=elm.nfix1;j++){
						if(elm.arChild[j]){
							elm.arChild[j].classList.remove('arisi');
						}
					}
					for(var j=1;j<=elm.ct;j++){
						if(elm.arChild[j]){
							elm.arChild[j].classList.add('arisi');
						}
					}
				}else{
					elm.ct=0;
				}
				elm.pembilang.innerHTML = elm.ct;
				elm.penyebut.innerHTML = elm.nfix1;
				/*
				
				var fpb = CariFPB([ct,nfix1])
				pembilang1.innerHTML = ct/fpb;
				penyebut1.innerHTML = nfix1/fpb;
				*/
			}
			

            function dragMouseMove(e) {
				e.preventDefault();
				if(selectedEl){
					let deltaX=0;
					let deltaY=0;
					if(e.type==="touchmove"){
						deltaX = (e.touches[0].clientX - startX) / scl;
						deltaY = (e.touches[0].clientY - startY) / scl;
					}else{
						deltaX = (e.clientX - startX) / scl;
						deltaY = (e.clientY - startY) / scl;
					}
					
					selectedEl.movein = true;
					AddRemove(selectedEl,Math.round(deltaX/10));
				}
            }
			
			function AddRemove(elm,nn){
				var ww = 700;
				var hh = 80;
				var nmax = 100
				elm.nfix = Math.min(Math.max(1,elm.nfix1+nn),nmax);
				for(var i=1;i<=nmax;i++){
					if(elm.arChild[i]) elm.arChild[i].remove();
				}
				var dx = ww/(elm.nfix*2);
				var x0f = elm.x0-ww/2 + dx;
				var y0f = elm.y0;//y0;
				for(var i=1;i<=elm.nfix;i++){
					elm.arChild[i] = document.createElement("div");
					elm.arChild[i].classList.add("arkotak");
					container.appendChild(elm.arChild[i]);
					elm.arChild[i].style.width = ww/elm.nfix+'px';
					elm.arChild[i].style.height = hh+'px';
					
					elm.arChild[i].style.left = (x0f+2*dx*(i-1))+'px';
					elm.arChild[i].style.top = (y0f)+'px';
					elm.arChild[i].klik = false;
				}
				elm.nfix0 = elm.nfix;
				elm.pembilang.innerHTML = 0;
				elm.penyebut.innerHTML = elm.nfix0;
				/*
				pembilang0.innerHTML = 0;
				penyebut0.innerHTML = nfix0;
				
				pembilang1.innerHTML = 0;
				penyebut1.innerHTML = nfix0;
				*/
			}
			
            function dragMouseUp() {
				if(selectedEl){
					if(!selectedEl.movein){
						cekTekan(startX,startY,selectedEl);
					}
					UnselectElement(selectedEl);
				}
			}
        }
	</script>	
	
	<script>
		//kotak0.addEventListener()
		setupDraggable(kotak0,myBG,container0,pembilang2,penyebut2);
		setupDraggable(kotak1,myBG,container1,pembilang3,penyebut3);
	</script>
	<script>
	
		var fixscale = 1;
		var fixzoom
		document.body.style.backgroundColor = "black";
		window.addEventListener('resize', () => {
			ZoomAll();
		});
		function XYbenda(){
			lebarJendela = window.innerWidth;
			tinggiJendela = window.innerHeight;
			myBG.x = window.scrollX+(lebarJendela-840*scl)/2;
			myBG.y = window.scrollY+(tinggiJendela-472*scl)/2;
			myBG.style.left = ''+(myBG.x)+'px';
			myBG.style.top = ''+(myBG.y)+'px';
		}
		function ZoomAll(){
			let lebarJendela = window.innerWidth;
			let tinggiJendela = window.innerHeight;
			var xscale = lebarJendela/840;
			var yscale = tinggiJendela/472;
			scl = 0.95*Math.min(xscale,yscale);
			fixscale = scl;
			fixzoom = scl*100;
			document.body.style.zoom = ""+fixzoom+"%";
			XYbenda();
		}
		
		ZoomAll();
		function handleClick(event) {
			console.log("handleClick");
		}
		myBG.addEventListener('click', handleClick);
		setTimeout(() => {
			console.log("handleClick")
			ZoomAll();
			myBG.removeEventListener('click', handleClick);
		}, 100);
		
	</script>
