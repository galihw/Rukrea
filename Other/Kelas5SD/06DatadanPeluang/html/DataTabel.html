	<script>
		function RandomAngkaAtoB(a,b){ 
			var r = a+Math.ceil(Math.random() * b);
			return r;
		}
		function RandomMyArray(Arr){
			for (var i=0; i<Arr.length; i++){
				var r = Math.floor(Math.random() * Arr.length);
				var a = Arr[i];
				Arr[i] = Arr[r];
				Arr[r] = a;
			}
			return Arr
		}
		function StringDesimal(ff){
			var strff = ""+ff;
			const gg = strff.split(".");
			if(gg.length==2)	return gg[0]+","+gg[1];
			else 				return ff
		}
		function StringRibuan(str){
			var strfix = "";
			var arfix = new Array();
			var StrArray = SplitString(str);
			for (var i=0; i<StrArray.length; i++){
				arfix.push(StrArray[i]);
			}
			var ct = 0;
			var m = 0;
			var n = 0;
			var ctmax = StrArray.length;
			var arct = new Array();
			for (var i=StrArray.length-1; i>=0; i--){
				ct++;
				ctmax--;
				if(ct==3){
					ct = 0;
					m++;
					arct.push(3);
				}
			}
			var n = StrArray.length - 3*arct.length;
			var iter=-1;
			strfix="";
			for (var i=0; i<n; i++){
				iter++;
				strfix += arfix[iter];
			}
			if (n>0)
				strfix += ".";
			for (var i=0; i<m; i++){
				for (j=0; j<3; j++){
					iter++;
					strfix += arfix[iter];
				}
				strfix += ".";
			}
			var leng = strfix.length;
			strfix = strfix.substr(0, leng-1);
			return strfix
		}
		function SplitString(ff){
			var gg = new Array();
			var strff = ""+ff;
			var len = strff.length;
			for (var i=0; i<len; i++){
				gg.push(strff.substr(i,1));
			}
			return gg;
		}
		function CariFPB(ar){
			//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
			
			var min = 0;
			var max = 0;
			for(var i=0;i<ar.length;i++){
				min = Math.min(min,ar[i]);
				max = Math.max(max,ar[i]);
			}
			
			var iter = 0;
			var fpb = 1;
			var f = [];
			do {
				iter++;
				ff = 1;
				for(var i=0;i<ar.length;i++){
					f[i] = (ar[i]%iter)==0;
					ff *= f[i];
				}
				
				if (ff){
					fpb = iter;
				}
				fakhir = iter==max;
			}while (!fakhir);
			
			return fpb;
		}
		function sortAZ(arr){
			arr.sort(function(a, b){return a-b});
			return arr;
		}
		function sortZA(arr){
			arr.sort(function(a, b){return b-a});
			return arr;
		}
	</script>

		function Klik(e){
			arNil[e.currentTarget.mc].ct++;

			arNil[6].ct++;

		function AcakData(){
			var data0 = [100,90,80,70,60,50];
			var get;
			var max = 0;
			var ctmax = 0;
			for(let i=0;i<7;i++){
				arNil[i].innerHTML = 0;
				arNil[i].ct = 0;
			}
			for(let i=0;i<30;i++){
				arKlik[i].innerHTML = arKlik.length;
			}
			do{
				for(let i=0;i<arKlik.length;i++){
					data0 = RandomMyArray(data0);
					get = data0[0];
					arKlik[i].innerHTML = get;
					arKlik[i].mc = get/10-5;
					arKlik[i].style.opacity = 1;
					arKlik[i].style.cursor = 'pointer';
					arKlik[i].addEventListener('click', Klik);
					arKlik[i].max = 0;
				}
				var cekData = [0,0,0,0,0,0];
				var cekBefore = [0,0,0,0,0,0];
				var cekAngka = [50,60,70,80,90,100];
				for(let i=0;i<arKlik.length;i++){
					cekData[arKlik[i].mc]++;
					cekBefore[arKlik[i].mc]++;
				}
				cekData=sortAZ(cekData);
				var ff = cekData[5]==cekData[6]; //acak ketika ada dua maksimum
				
			}while(ff)
			var mod = 0;
			for(let i=0;i<arKlik.length;i++){
				if(cekBefore[i]==cekData[5]){
					mod=cekAngka[i];
				}
			}
			modus.style.display = 'none';
			modus.innerHTML = 'modus = ?';
			modus.fix = mod;
		}
		function Reset(){
			AcakData();
		}
		Reset()
